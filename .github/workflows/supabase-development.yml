name: Supabase Development

'on':
    workflow_dispatch:
        inputs:
            backup_recovery_confirmed:
                description: Confirm that a current recoverable Development backup and recovery plan were reviewed
                required: true
                type: boolean

concurrency:
    group: supabase-development-deployment
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    validate-dispatch:
        runs-on: ubuntu-latest

        steps:
            - name: Require the develop branch
              run: test "$GITHUB_REF" = "refs/heads/develop"

            - name: Require backup and recovery confirmation
              run: test "${{ inputs.backup_recovery_confirmed }}" = "true"

    plan:
        needs: validate-dispatch
        runs-on: ubuntu-latest
        environment:
            name: development
        env:
            SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
            SUPABASE_EXPECTED_PROJECT_REF: ${{ vars.SUPABASE_EXPECTED_PROJECT_REF }}
            SUPABASE_POOLER_DB_URL: ${{ secrets.SUPABASE_DEV_POOLER_DB_URL }}
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Supabase CLI
              uses: supabase/setup-cli@v1
              with:
                  version: 3.3.0

            - name: Validate Development target
              run: |
                  if [ -z "$SUPABASE_PROJECT_REF" ]; then
                      echo "::error::SUPABASE_DEV_PROJECT_REF is not configured."
                      exit 1
                  fi
                  if [ -z "$SUPABASE_EXPECTED_PROJECT_REF" ]; then
                      echo "::error::SUPABASE_EXPECTED_PROJECT_REF is not configured."
                      exit 1
                  fi
                  if [ "$SUPABASE_PROJECT_REF" != "$SUPABASE_EXPECTED_PROJECT_REF" ]; then
                      echo "::error::Development target does not match the approved project ref."
                      exit 1
                  fi
                  if [ -z "$SUPABASE_POOLER_DB_URL" ]; then
                      echo "::error::SUPABASE_DEV_POOLER_DB_URL is not configured."
                      exit 1
                  fi
                  if ! python3 - <<'PY'
                  import os
                  from urllib.parse import parse_qs, unquote, urlparse

                  expected_ref = os.environ["SUPABASE_EXPECTED_PROJECT_REF"]
                  pooler_url = os.environ["SUPABASE_POOLER_DB_URL"]
                  try:
                      parsed = urlparse(pooler_url)
                      port = parsed.port
                  except ValueError:
                      raise SystemExit(1)
                  password = parsed.password or ""
                  values_to_mask = {pooler_url, password}
                  decoded_password = password
                  for _ in range(3):
                      decoded_password = unquote(decoded_password)
                      if decoded_password in values_to_mask:
                          break
                      values_to_mask.add(decoded_password)
                  for value in values_to_mask:
                      if value:
                          print(f"::add-mask::{value}")
                  sslmode = parse_qs(parsed.query).get("sslmode", [""])[0].lower()
                  valid = (
                      parsed.scheme in {"postgres", "postgresql"}
                      and parsed.username == f"postgres.{expected_ref}"
                      and parsed.password is not None
                      and parsed.hostname is not None
                      and parsed.hostname.endswith(".pooler.supabase.com")
                      and port == 5432
                      and parsed.path == "/postgres"
                      and sslmode in {"require", "verify-ca", "verify-full"}
                  )
                  raise SystemExit(0 if valid else 1)
                  PY
                  then
                      echo "::error::Development pooler URL does not match the approved Session pooler target."
                      exit 1
                  fi

            - name: Record migration history and dry-run plan
              run: |
                  set -uo pipefail
                  mkdir -p deployment-preflight
                  trap 'echo "Failure: preflight command failed at line $LINENO." >> deployment-preflight/diagnostics.txt; echo "::error::Development migration preflight failed. See the migration preflight artifact."' ERR

                  fail_preflight() {
                      echo "Failure: $1" >> deployment-preflight/diagnostics.txt
                      echo "::error::$1 See the migration preflight artifact."
                      exit 1
                  }

                  if ! supabase migration list --remote="$SUPABASE_POOLER_DB_URL" \
                      > deployment-preflight/migration-history.txt 2>&1; then
                      fail_preflight "Unable to read remote migration history."
                  fi
                  find supabase/migrations -maxdepth 1 -type f -name '*.sql' \
                      -printf '%f\n' | sed -n 's/^\([0-9]\{14\}\)_.*/\1/p' | sort -u \
                      > deployment-preflight/local-migrations.txt
                  if ! awk -F '[│|]' '
                      function version(value) {
                          gsub(/[^0-9]/, "", value)
                          return value
                      }
                      index($0, "│") || index($0, "|") {
                          local_version = version($1)
                          remote_version = version($2)
                          if (local_version == "" && remote_version == "") next
                          if (local_version == "") {
                              print "Remote-only migration: " $0 > "/dev/stderr"
                              invalid = 1
                              next
                          }
                          if (remote_version == "") {
                              pending = 1
                              print "pending " local_version
                              next
                          }
                          if (local_version != remote_version || pending) {
                              print "Migration history mismatch: " $0 > "/dev/stderr"
                              invalid = 1
                              next
                          }
                          print "applied " local_version
                      }
                      END { exit invalid }
                  ' deployment-preflight/migration-history.txt \
                      > deployment-preflight/migration-history.normalized.txt; then
                      fail_preflight "Remote migration history contains a remote-only migration or a history gap."
                  fi
                  sed -n 's/^pending //p' \
                      deployment-preflight/migration-history.normalized.txt \
                      > deployment-preflight/pending-migrations.txt
                  sed -n 's/^[a-z]* //p' \
                      deployment-preflight/migration-history.normalized.txt \
                      > deployment-preflight/parsed-local-migrations.txt
                  if [ ! -s deployment-preflight/local-migrations.txt ]; then
                      fail_preflight "No local migration files were parsed."
                  fi
                  if [ ! -s deployment-preflight/migration-history.normalized.txt ]; then
                      fail_preflight "No remote migration history rows were parsed."
                  fi
                  if ! cmp --silent deployment-preflight/local-migrations.txt \
                      deployment-preflight/parsed-local-migrations.txt; then
                      diff -u deployment-preflight/local-migrations.txt \
                          deployment-preflight/parsed-local-migrations.txt \
                          > deployment-preflight/migration-history.diff || true
                      fail_preflight "Normalized migration history does not match local migration files."
                  fi
                  if ! supabase db push --remote="$SUPABASE_POOLER_DB_URL" --dry-run --yes \
                      > deployment-preflight/migration-plan.txt 2>&1; then
                      fail_preflight "Supabase dry-run failed."
                  fi
                  while IFS= read -r version; do
                      if grep -Fq "$version" deployment-preflight/migration-plan.txt; then
                          echo "$version"
                      fi
                  done < deployment-preflight/local-migrations.txt | sort -u \
                      > deployment-preflight/migration-plan.normalized.txt
                  if [ -s deployment-preflight/pending-migrations.txt ]; then
                      if [ ! -s deployment-preflight/migration-plan.normalized.txt ]; then
                          fail_preflight "Dry-run did not report the pending migration set."
                      fi
                  fi
                  if ! cmp --silent deployment-preflight/pending-migrations.txt \
                      deployment-preflight/migration-plan.normalized.txt; then
                      diff -u deployment-preflight/pending-migrations.txt \
                          deployment-preflight/migration-plan.normalized.txt \
                          > deployment-preflight/migration-plan.diff || true
                      fail_preflight "Dry-run migration plan does not match the pending migration set."
                  fi

            - name: Sanitize migration preflight diagnostics
              id: sanitize_migration_preflight
              if: ${{ always() }}
              run: |
                  python3 - <<'PY'
                  import os
                  import re
                  import shutil
                  from urllib.parse import unquote, urlparse
                  from pathlib import Path

                  source = Path("deployment-preflight")
                  destination = Path("deployment-preflight-sanitized")
                  if destination.exists():
                      shutil.rmtree(destination)
                  destination.mkdir()

                  secrets = set()
                  for name, value in os.environ.items():
                      if not value or not any(
                          marker in name
                          for marker in ("TOKEN", "PASSWORD", "SECRET", "DATABASE_URL", "DB_URL")
                      ):
                          continue
                      secrets.add(value)
                      if name.endswith("DB_URL") or "DATABASE_URL" in name:
                          password = urlparse(value).password or ""
                          for _ in range(3):
                              if not password:
                                  break
                              secrets.add(password)
                              decoded_password = unquote(password)
                              if decoded_password == password:
                                  break
                              password = decoded_password
                  patterns = (
                      (re.compile(r"(?i)(authorization:\\s*bearer\\s+)\\S+"), r"\\1[REDACTED]"),
                      (re.compile(r"(?i)(postgres(?:ql)?://)[^\\s'\\\"]+"), r"\\1[REDACTED]"),
                      (re.compile(r"(?i)([?&](?:password|token|secret|apikey|api_key)=)[^&\\s]+"), r"\\1[REDACTED]"),
                      (re.compile(r"(?i)([\\\"']?(?:password|token|secret|apikey|api_key|access_token|refresh_token)[\\\"']?\\s*[:=]\\s*[\\\"']?)[^\\s,;\\\"'}]+"), r"\\1[REDACTED]"),
                      (re.compile(r"(?<![A-Za-z0-9_-])eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+"), "[REDACTED_JWT]"),
                  )

                  def sanitize(text):
                      for secret in secrets:
                          text = text.replace(secret, "[REDACTED]")
                      for pattern, replacement in patterns:
                          text = pattern.sub(replacement, text)
                      return text

                  if source.is_dir():
                      for path in source.rglob("*"):
                          if path.is_file():
                              relative_path = path.relative_to(source)
                              target_path = destination / relative_path
                              target_path.parent.mkdir(parents=True, exist_ok=True)
                              target_path.write_text(
                                  sanitize(path.read_text(encoding="utf-8", errors="replace")),
                                  encoding="utf-8",
                              )
                  else:
                      (destination / "diagnostics.txt").write_text(
                          "Preflight did not create diagnostics before failing.\n",
                          encoding="utf-8",
                      )
                  (destination / "sanitization-status.txt").write_text(
                      "Diagnostics were sanitized before upload.\n",
                      encoding="utf-8",
                  )
                  PY

            - name: Upload migration preflight
              if: ${{ always() && steps.sanitize_migration_preflight.outcome == 'success' }}
              uses: actions/upload-artifact@v4
              with:
                  name: supabase-development-migration-preflight
                  path: deployment-preflight-sanitized
                  retention-days: 30

    deploy-and-build:
        needs: plan
        runs-on: ubuntu-latest
        environment:
            name: development
        env:
            SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
            SUPABASE_EXPECTED_PROJECT_REF: ${{ vars.SUPABASE_EXPECTED_PROJECT_REF }}
            SUPABASE_POOLER_DB_URL: ${{ secrets.SUPABASE_DEV_POOLER_DB_URL }}
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.11.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Setup Supabase CLI
              uses: supabase/setup-cli@v1
              with:
                  version: 3.3.0

            - name: Download approved migration preflight
              uses: actions/download-artifact@v4
              with:
                  name: supabase-development-migration-preflight
                  path: deployment-preflight

            - name: Revalidate Development target and migration plan
              run: |
                  set -Euo pipefail
                  mkdir -p deployment-preflight-recheck
                  trap 'echo "Failure: revalidation command failed at line $LINENO." >> deployment-preflight-recheck/diagnostics.txt; echo "::error::Development revalidation failed. See the recheck preflight artifact."' ERR
                  if [ -z "$SUPABASE_PROJECT_REF" ]; then
                      echo "::error::SUPABASE_DEV_PROJECT_REF is not configured."
                      exit 1
                  fi
                  if [ -z "$SUPABASE_EXPECTED_PROJECT_REF" ]; then
                      echo "::error::SUPABASE_EXPECTED_PROJECT_REF is not configured."
                      exit 1
                  fi
                  if [ "$SUPABASE_PROJECT_REF" != "$SUPABASE_EXPECTED_PROJECT_REF" ]; then
                      echo "::error::Development target does not match the approved project ref."
                      exit 1
                  fi
                  if [ -z "$SUPABASE_POOLER_DB_URL" ]; then
                      echo "::error::SUPABASE_DEV_POOLER_DB_URL is not configured."
                      exit 1
                  fi
                  if ! python3 - <<'PY'
                  import os
                  from urllib.parse import parse_qs, unquote, urlparse

                  expected_ref = os.environ["SUPABASE_EXPECTED_PROJECT_REF"]
                  pooler_url = os.environ["SUPABASE_POOLER_DB_URL"]
                  try:
                      parsed = urlparse(pooler_url)
                      port = parsed.port
                  except ValueError:
                      raise SystemExit(1)
                  password = parsed.password or ""
                  values_to_mask = {pooler_url, password}
                  decoded_password = password
                  for _ in range(3):
                      decoded_password = unquote(decoded_password)
                      if decoded_password in values_to_mask:
                          break
                      values_to_mask.add(decoded_password)
                  for value in values_to_mask:
                      if value:
                          print(f"::add-mask::{value}")
                  sslmode = parse_qs(parsed.query).get("sslmode", [""])[0].lower()
                  valid = (
                      parsed.scheme in {"postgres", "postgresql"}
                      and parsed.username == f"postgres.{expected_ref}"
                      and parsed.password is not None
                      and parsed.hostname is not None
                      and parsed.hostname.endswith(".pooler.supabase.com")
                      and port == 5432
                      and parsed.path == "/postgres"
                      and sslmode in {"require", "verify-ca", "verify-full"}
                  )
                  raise SystemExit(0 if valid else 1)
                  PY
                  then
                      echo "::error::Development pooler URL does not match the approved Session pooler target."
                      exit 1
                  fi
                  supabase migration list --remote="$SUPABASE_POOLER_DB_URL" \
                      > deployment-preflight-recheck/migration-history.txt 2>&1
                  find supabase/migrations -maxdepth 1 -type f -name '*.sql' \
                      -printf '%f\n' | sed -n 's/^\([0-9]\{14\}\)_.*/\1/p' | sort -u \
                      > deployment-preflight-recheck/local-migrations.txt
                  awk -F '[│|]' '
                      function version(value) {
                          gsub(/[^0-9]/, "", value)
                          return value
                      }
                      index($0, "│") || index($0, "|") {
                          local_version = version($1)
                          remote_version = version($2)
                          if (local_version == "" && remote_version == "") next
                          if (local_version == "") {
                              print "Remote-only migration: " $0 > "/dev/stderr"
                              invalid = 1
                              next
                          }
                          if (remote_version == "") {
                              pending = 1
                              print "pending " local_version
                              next
                          }
                          if (local_version != remote_version || pending) {
                              print "Migration history mismatch: " $0 > "/dev/stderr"
                              invalid = 1
                              next
                          }
                          print "applied " local_version
                      }
                      END { exit invalid }
                  ' deployment-preflight-recheck/migration-history.txt \
                      > deployment-preflight-recheck/migration-history.normalized.txt
                  sed -n 's/^pending //p' \
                      deployment-preflight-recheck/migration-history.normalized.txt \
                      > deployment-preflight-recheck/pending-migrations.txt
                  sed -n 's/^[a-z]* //p' \
                      deployment-preflight-recheck/migration-history.normalized.txt \
                      > deployment-preflight-recheck/parsed-local-migrations.txt
                  test -s deployment-preflight-recheck/local-migrations.txt
                  test -s deployment-preflight-recheck/migration-history.normalized.txt
                  cmp --silent deployment-preflight-recheck/local-migrations.txt \
                      deployment-preflight-recheck/parsed-local-migrations.txt
                  supabase db push --remote="$SUPABASE_POOLER_DB_URL" --dry-run --yes \
                      > deployment-preflight-recheck/migration-plan.txt 2>&1
                  while IFS= read -r version; do
                      if grep -Fq "$version" deployment-preflight-recheck/migration-plan.txt; then
                          echo "$version"
                      fi
                  done < deployment-preflight-recheck/local-migrations.txt | sort -u \
                      > deployment-preflight-recheck/migration-plan.normalized.txt
                  if [ -s deployment-preflight-recheck/pending-migrations.txt ]; then
                      test -s deployment-preflight-recheck/migration-plan.normalized.txt
                  fi
                  cmp --silent deployment-preflight-recheck/pending-migrations.txt \
                      deployment-preflight-recheck/migration-plan.normalized.txt
                  cmp --silent deployment-preflight/migration-history.normalized.txt \
                      deployment-preflight-recheck/migration-history.normalized.txt
                  cmp --silent deployment-preflight/migration-plan.normalized.txt \
                      deployment-preflight-recheck/migration-plan.normalized.txt

            - name: Sanitize recheck preflight diagnostics
              id: sanitize_recheck_preflight
              if: ${{ always() }}
              run: |
                  python3 - <<'PY'
                  import os
                  import re
                  import shutil
                  from urllib.parse import unquote, urlparse
                  from pathlib import Path

                  source = Path("deployment-preflight-recheck")
                  destination = Path("deployment-preflight-recheck-sanitized")
                  if destination.exists():
                      shutil.rmtree(destination)
                  destination.mkdir()

                  secrets = set()
                  for name, value in os.environ.items():
                      if not value or not any(
                          marker in name
                          for marker in ("TOKEN", "PASSWORD", "SECRET", "DATABASE_URL", "DB_URL")
                      ):
                          continue
                      secrets.add(value)
                      if name.endswith("DB_URL") or "DATABASE_URL" in name:
                          password = urlparse(value).password or ""
                          for _ in range(3):
                              if not password:
                                  break
                              secrets.add(password)
                              decoded_password = unquote(password)
                              if decoded_password == password:
                                  break
                              password = decoded_password
                  patterns = (
                      (re.compile(r"(?i)(authorization:\\s*bearer\\s+)\\S+"), r"\\1[REDACTED]"),
                      (re.compile(r"(?i)(postgres(?:ql)?://)[^\\s'\\\"]+"), r"\\1[REDACTED]"),
                      (re.compile(r"(?i)([?&](?:password|token|secret|apikey|api_key)=)[^&\\s]+"), r"\\1[REDACTED]"),
                      (re.compile(r"(?i)([\\\"']?(?:password|token|secret|apikey|api_key|access_token|refresh_token)[\\\"']?\\s*[:=]\\s*[\\\"']?)[^\\s,;\\\"'}]+"), r"\\1[REDACTED]"),
                      (re.compile(r"(?<![A-Za-z0-9_-])eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+"), "[REDACTED_JWT]"),
                  )

                  def sanitize(text):
                      for secret in secrets:
                          text = text.replace(secret, "[REDACTED]")
                      for pattern, replacement in patterns:
                          text = pattern.sub(replacement, text)
                      return text

                  if source.is_dir():
                      for path in source.rglob("*"):
                          if path.is_file():
                              relative_path = path.relative_to(source)
                              target_path = destination / relative_path
                              target_path.parent.mkdir(parents=True, exist_ok=True)
                              target_path.write_text(
                                  sanitize(path.read_text(encoding="utf-8", errors="replace")),
                                  encoding="utf-8",
                              )
                  else:
                      (destination / "diagnostics.txt").write_text(
                          "Recheck did not create diagnostics before failing.\n",
                          encoding="utf-8",
                      )
                  (destination / "sanitization-status.txt").write_text(
                      "Diagnostics were sanitized before upload.\n",
                      encoding="utf-8",
                  )
                  PY

            - name: Upload recheck migration preflight
              if: ${{ always() && steps.sanitize_recheck_preflight.outcome == 'success' }}
              uses: actions/upload-artifact@v4
              with:
                  name: supabase-development-migration-preflight-recheck
                  path: deployment-preflight-recheck-sanitized
                  retention-days: 30

            - name: Push migrations to Development
              run: supabase db push --remote="$SUPABASE_POOLER_DB_URL" --yes

            - name: Deploy Edge Functions to Development
              run: |
                  for function in supabase/functions/*; do
                      if [ -d "$function" ] && [ -f "$function/index.ts" ]; then
                          function_name=$(basename "$function")
                          echo "Deploying Edge Function: $function_name"
                          supabase functions deploy "$function_name" --remote="$SUPABASE_PROJECT_REF" --yes
                      fi
                  done

            - name: Calculate build number
              run: |
                  BUILD_NUMBER=$((200 + GITHUB_RUN_NUMBER))
                  echo "APP_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
                  echo "Build number: $BUILD_NUMBER"

            - name: Create Development environment file
              run: |
                  cat > .env.development <<EOF
                  EXPO_PUBLIC_APP_ENV=Dev
                  EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_DEV_URL }}
                  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_DEV_PUBLISHABLE_KEY }}
                  EXPO_PUBLIC_SENTRY_DSN=${{ secrets.EXPO_PUBLIC_SENTRY_DEV_DSN }}
                  EOF

            - name: Build Development APK
              run: pnpm build:apk:dev
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

            - name: Upload Development APK
              uses: actions/upload-artifact@v4
              with:
                  name: SL-Dev-${{ env.APP_BUILD_NUMBER }}-v1.0.0
                  path: SL-Dev-${{ env.APP_BUILD_NUMBER }}-v1.0.0.apk
                  retention-days: 30
