const counts=l=>{let n=l.items.length,d=l.items.filter(i=>i.done).length;return [n,d,n?Math.round(d/n*100):0]};const track=(p,done=false)=>`<div class="track"><i style="width:${p}%;${done?'background:#21866b':''}"></i></div>`;function card(l,preview=false){let[n,d,p]=counts(l),done=n>0&&n===d;return `<${preview?'div':'button'} class="card listcard" ${preview?'':`data-a="open" data-id="${l.id}"`}><div class="row"><div class="tile" style="background:${colors[l.color]}">${art(l.icon)}</div><div class="grow"><strong>${esc(l.name||'List name')}</strong>${l.members.length>1?'<span style="display:inline-block;width:15px;color:#585bd6;vertical-align:middle;margin-left:5px">'+ico('filled')+'</span>':''}<br><small>${n?`${n} items · ${d} completed`:'No items yet'}</small></div><small style="color:${done?'#21866b':'#585bd6'}">${done?'✓ ':''}${n?p+'%':''}</small><span style="color:#9094a5">›</span></div>${track(p,done)}</${preview?'div':'button'}>`;}

const empty=(k,t,d,b='',a='')=>`<div class="empty">${art(k,0)}<h3>${t}</h3><p>${d}</p>${b?`<button class="primary" data-a="${a}" ${offline()&&a!=='retry'?'disabled':''}>${b}</button>`:''}</div>`;const sk=(w,h)=>`<div class="sk" style="width:${w};height:${h}px"></div>`;function skeleton(){return `<div class="hero">${sk('45%',10)}<br>${sk('80%',24)}<br>${sk('100%',6)}</div>${[1,2,3].map(()=>`<div class="card"><div class="row">${sk('55px',55)}<div class="grow">${sk('80%',13)}<br>${sk('55%',9)}</div></div><br>${sk('100%',5)}</div>`).join('')}`;}

function sharing(l){return `<p>${esc(l.name)} · ${l.members.length} ${l.members.length===1?'member':'members'}</p>${l.members.map(m=>`<div class="row member"><div class="avatar">${esc(m[0].toUpperCase())}</div><div class="grow"><strong style="font-size:13px">${esc(m)}</strong><br><small>${m===l.owner?'Owner':'Member'}${m===user?' · You':''}</small></div>${own(l)&&m!==l.owner?`<button class="tool" data-a="remove" data-email="${esc(m)}" aria-label="Remove member" ${blocked()?'disabled':''}>${ico('trash')}</button>`:''}</div>`).join('')}${own(l)?`<form id="memberform"><label>Add a member</label><input name="email" type="email" required placeholder="Email address">${error?`<p class="danger">${esc(error)}</p>`:''}<button class="primary wide" style="margin-top:12px" ${blocked()?'disabled':''}>Add member</button></form>`:'<p style="margin-top:14px">Only the owner can manage members.</p>'}`;}
function confirm(title,desc,action,label){confirmAction=action;modal='confirm';draft={title,desc,label};popup='';render()}
function render(){let l=current();if(page==='details'&&!l)page='main';let main=page==='main',body='',header='',hour=new Date().getHours(),period=time==='auto'?(hour>=5&&hour<12?'morning':hour>=12&&hour<17?'afternoon':hour>=17&&hour<22?'evening':'night'):time;let periodIndex=['morning','afternoon','evening','night'].indexOf(period);if(page==='auth'){body=`<div class="auth">${art(0,2)}<h1 style="text-align:center">Shopping List</h1><p style="text-align:center">Plan, shop and share together.</p><div class="tabs"><button data-a="signin" class="${!register?'active':''}">Sign in</button><button data-a="register" class="${register?'active':''}">Register</button></div><h2>${register?'Create account':'Welcome back'}</h2><form id="authform"><label>Email</label><input name="email" type="email" required value="${esc(user)}"><label>Password</label><input name="password" type="password" required placeholder="Your password"><button class="primary wide" style="margin-top:16px">${register?'Create account':'Sign in'}</button></form><small style="text-align:center">SL-Dev · v1.0.0 · Prototype</small></div>`;}else{header=main?`<div class="row"><div style="width:39px;height:39px">${art(10+periodIndex)}</div><h1 class="grow">Good ${period}!</h1><button class="avatar" data-a="account" aria-label="Account">${esc(user[0].toUpperCase())}</button></div>`:`<div class="row header">${tool('back','back','Go back')}<div class="tile" style="background:${colors[l.color]}">${art(l.icon)}</div><div class="grow"><h1>${esc(l.name)}</h1></div>${tool(l.members.length>1?'filled':'users','sharing','Sharing',state==='loading'||state==='error')}${tool('bell','notify','Notify members',blocked()||l.members.length<2)}${tool('dots','actions','List actions',blocked())}</div>${l.desc?`<p style="margin:5px 0 0 46px">${esc(l.desc)}</p>`:''}`;if(offline())body+=`<div class="notice"><strong>You're offline</strong>${state==='offline'?'<br>Showing last available data.':''}</div>`;if(state==='refresh-error')body+='<div class="notice error">Couldn’t refresh data.<br>Showing last available data.<br><button class="link" data-a="retry">Try again</button></div>';if(state==='loading')body+=skeleton();else if(state==='error'||state==='offline-empty')body+=empty(8,state==='error'?'Couldn’t load data':'You’re offline',state==='error'?'Something went wrong. Please try again.':'Connect to the internet to load your shopping lists.','Try again','retry');else if(main){let v=state==='empty'?[]:visible(),eligible=v.filter(x=>x.items.length),d=eligible.filter(x=>counts(x)[2]===100).length;if(v.length)body+=hero(eligible.length,d,v.length-eligible.length,true);body+=`<div class="row" style="margin:14px 0 5px"><div class="tabs grow">${['All','Mine','Shared'].map(f=>`<button data-a="filter" data-filter="${f}" class="${filter===f?'active':''}">${f}</button>`).join('')}</div><button class="plus" data-a="new" aria-label="New list" ${blocked()?'disabled':''}>+</button></div>`;body+=v.length?v.map(x=>card(x)).join(''):filter==='Shared'?empty(14,'Better together.','Lists shared with you will appear here.'):empty(8,'Every shop starts with a list.','Create your first shopping list.','+ Create a list','new');}else{let[n,d]=state==='empty'?[0,0]:counts(l);if(n)body+=hero(n,d);body+=`<div class="row section"><span class="grow">TO BUY · ${n-d}</span><button class="plus" data-a="quick" aria-label="Add item" ${blocked()?'disabled':''}>+</button></div>`;if(quick)body+=itemForm();if(!n)body+=empty(8,'Your basket is empty.','Add something to your shopping list.','+ Add item','quick');else{body+=n>d?rows(l,false):'<p style="color:#21866b">Nothing left to buy. Nicely done!</p>';if(d)body+=`<button class="section wide" style="text-align:left" data-a="collapse">COMPLETED · ${d}<span style="float:right">${collapsed?'⌄':'⌃'}</span></button>${collapsed?'':rows(l,true)}`;}}}
let pop=popup?`<div class="backdrop" data-a="close-popup"></div><div class="popup">${popup==='account'?`<strong style="display:block;padding:9px;overflow-wrap:anywhere">${esc(user)}</strong><small style="padding:9px">SL-Dev · v1.0.0</small><button class="action danger" data-a="logout">Log out</button>`:own(l)?'<button class="action" data-a="edit-list">✎　Edit list</button><hr style="border:0;border-top:1px solid #e8e9f1"><button class="action danger" data-a="delete-list">Delete list</button>':'<button class="action danger" data-a="leave">Leave list</button>'}</div>`:'';
let mod=modal?`<div class="overlay" data-a="outside"><div class="modal" role="dialog" aria-modal="true"><div class="row"><h3 class="grow">${modal==='new'?'New list':modal==='edit'?'Edit list':modal==='sharing'?'Sharing':esc(draft.title)}</h3>${tool('close','close-modal','Close')}</div>${modal==='new'||modal==='edit'?listForm():modal==='sharing'?sharing(l):`<p style="margin:14px 0">${esc(draft.desc)}</p><div class="row"><button class="secondary grow" data-a="close-modal">Cancel</button><button class="dangerbtn grow" data-a="confirm">${esc(draft.label)}</button></div>`}</div></div>`:'';
$('phone').innerHTML=`<div class="status">${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}<span style="float:right">▮▮ ◔ ▰</span></div><div class="screen">${header}${body}</div><div class="home"></div>${pop}${mod}${toast?`<div class="toast" role="status">${esc(toast)}</div>`:''}`;renderSide();}
function renderSide(){const choices=(arr,a,val)=>arr.map(([v,t])=>`<button data-a="${a}" data-value="${esc(v)}" class="${v===val?'active':''}">${t}</button>`).join('');$('side').innerHTML=`<h2>Shopping List · v0.3</h2><p>Friendly Edition · interactive design reference</p><div class="panel"><strong>Demo controls</strong><p style="margin-top:8px">Account</p>${choices(users.map((u,i)=>[u,['Dev1','Yulia','Max'][i]]),'user',user)}<p>Screen</p>${choices([['main','Main'],['details','Details'],['auth','Auth']],'screen',page)}<p>Time of day</p>${choices(['auto','morning','afternoon','evening','night'].map(x=>[x,x]),'time',time)}<p>Application state</p>${choices([['normal','Normal'],['loading','Loading'],['empty','Empty'],['done','All done'],['offline','Offline · cached'],['offline-empty','Offline · no cache'],['error','Error'],['refresh-error','Refresh error']],'state',state)}<button data-a="reset">↻ Reset demo</button></div><div class="panel"><div class="row"><strong class="grow">Push simulation</strong><button data-a="clear-events">Clear</button></div><p>Switch accounts to test access. Tap a notification to simulate opening it as its recipient.</p>${events.length?events.map((e,i)=>`<div class="event"><small>To: ${esc(e.to)}</small><br><strong>${esc(e.title)}</strong><p>${esc(e.body)}</p><button data-a="event" data-id="${i}">Open notification</button></div>`).join(''):'<p style="margin-top:10px">No notifications yet.</p>'}</div><div class="panel"><strong>Prototype notes</strong><p>Local demo only. SVG miniature stand-ins, no real authentication, network, database or push delivery. Reset restores sample data.</p></div>`;}
function captureItem(){let f=$('itemform');if(f){let d=new FormData(f);formItem={...formItem,name:d.get('name'),q:Number(d.get('q')||formItem?.q||1),unit:d.get('unit')??formItem?.unit??'',note:d.get('note')??formItem?.note??''}}}
document.addEventListener('input',e=>{if(e.target.closest('#listform')){let f=new FormData($('listform'));draft.name=f.get('name');draft.desc=f.get('desc');$('preview').innerHTML=card(draft,true);$('save-list').disabled=!draft.name.trim()||blocked()}else if(e.target.closest('#itemform'))captureItem()});
document.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),l=current();if(e.target.id==='authform'){user=String(f.get('email')).trim().toLowerCase();goMain();return}if(blocked())return;if(e.target.id==='listform'){if(!draft.name.trim())return;draft.name=draft.name.trim();if(modal==='new'){lists.push(draft);openList(draft.id)}else if(l&&own(l)){Object.assign(l,draft);modal='';render()}}else if(e.target.id==='itemform'&&l){captureItem();if(!formItem.name.trim()||!Number.isFinite(formItem.q)||formItem.q<=0)return;if(editItem){Object.assign(l.items.find(i=>i.id===editItem),formItem);quick=false;editItem=null}else{l.items.push(item(formItem.name.trim(),false,formItem.q,formItem.unit,formItem.note));formItem={name:'',q:1,unit:'',note:''};more=false}render();$('itemform')?.querySelector('input')?.focus()}else if(e.target.id==='memberform'&&l&&own(l)){let m=String(f.get('email')).trim().toLowerCase();if(l.members.includes(m)){error='This person is already a member.';render();return}l.members.push(m);notify(m,"You've been added to a list",`${user} added you to “${l.name}”.`,l);error='';render()}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-a]');if(!b||b.disabled)return;let a=b.dataset.a,v=b.dataset.value,i=Number(b.dataset.id),l=current();if(a==='outside'&&e.target!==b)return;toast='';if(a==='user'){user=v;state='normal';filter='All';goMain();return}if(a==='screen'){state='normal';if(v==='details'){let x=visible()[0];if(x){openList(x.id);return}}page=v==='details'?'main':v;popup=modal=''}else if(a==='time')time=v;else if(a==='state'){state=v;popup=modal='';quick=false;if(v==='done'){lists.filter(x=>x.members.includes(user)).forEach(x=>x.items.forEach(y=>y.done=true));state='normal'}}else if(a==='reset'){lists=seed();user=users[0];page='main';id=1;filter='All';state='normal';time='auto';popup=modal='';quick=false;events=[]}else if(a==='clear-events')events=[];else if(a==='event'){let ev=events[i];user=ev.to;state='normal';filter='All';if(ev.route&&lists.some(x=>x.id===ev.id&&x.members.includes(user))){openList(ev.id);return}goMain();return}else if(a==='back'){goMain();return}else if(a==='filter')filter=b.dataset.filter;else if(a==='open'){openList(i);return}else if(a==='account'||a==='actions')popup=popup===a?'':a;else if(a==='close-popup')popup='';else if(a==='logout'){page='auth';popup=''}else if(a==='signin'||a==='register')register=a==='register';else if(a==='retry'){state='loading';render();setTimeout(()=>{if(state==='loading'){state='normal';render()}},850);return}else if(a==='close-modal'||a==='outside'){modal='';error=''}else if(a==='sharing'){modal='sharing';popup='';error=''}else if(a==='collapse')collapsed=!collapsed;else if(a==='more'){captureItem();more=!more}else if(a==='cancel-item'){quick=false;editItem=null}else if(a==='pick')draft.icon=i;else if(a==='color')draft.color=i;else if(a==='confirm'){let fn=confirmAction;modal='';confirmAction=null;if(!blocked()&&fn)fn()}else if(!blocked()){if(a==='new'){draft={id:++seq,name:'',desc:'',icon:0,color:0,owner:user,members:[user],items:[]};modal='new';popup=''}else if(a==='edit-list'&&l&&own(l)){draft={...l};modal='edit';popup=''}else if(a==='quick'){quick=true;more=false;editItem=null;formItem={name:'',q:1,unit:'',note:''};if(state==='empty')state='normal'}else if(a==='edit-item'&&l){editItem=i;formItem={...l.items.find(x=>x.id===i)};quick=more=true}else if(a==='toggle'&&l){let x=l.items.find(x=>x.id===i);x.done=!x.done}else if(a==='delete-item'&&l){confirm('Delete item?','This item will be removed from the list.',()=>{l.items=l.items.filter(x=>x.id!==i)},'Delete');return}else if(a==='notify'&&l){l.members.filter(m=>m!==user).forEach(m=>notify(m,'Shopping List',`${user} updated list «${l.name}»`,l));flash('Notification sent · Demo');return}else if(a==='remove'&&l&&own(l)){let m=b.dataset.email;confirm('Remove this member?',`${m} will lose access.`,()=>{l.members=l.members.filter(x=>x!==m);notify(m,'List access removed',`You no longer have access to “${l.name}”.`,l,false);modal='sharing'},'Remove');return}else if(a==='leave'&&l&&!own(l)){confirm('Leave this list?','You will lose access to this shared list.',()=>{l.members=l.members.filter(m=>m!==user);notify(l.owner,'A member left your list',`${user} left “${l.name}”.`,l);page='main'},'Leave');return}else if(a==='delete-list'&&l&&own(l)){confirm('Delete this list?','The list and its items will be removed for everyone.',()=>{l.members.filter(m=>m!==user).forEach(m=>notify(m,'Shared list deleted',`${user} deleted “${l.name}”.`,l,false));lists=lists.filter(x=>x.id!==l.id);page='main'},'Delete');return}}render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal)modal='';else if(popup)popup='';else if(quick)quick=false;else if(page==='details')page='main';render()}});render();
</script></body></html>
