<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping List · Soft Indigo</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9eaf3;font:16px system-ui,sans-serif;color:#20243a}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid #585bd6}main{display:flex;justify-content:center;gap:36px;padding:28px;align-items:flex-start}.phone{width:390px;height:820px;max-width:100%;background:#f6f7fc;border:7px solid #252638;border-radius:38px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 20px 55px #25263822}.status{padding:15px 23px 5px;font-size:12px;font-weight:700;display:flex;justify-content:space-between}.screen{flex:1;overflow:auto;padding:20px;min-height:0}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:30px;letter-spacing:-1px;margin:10px 0}h2{font-size:21px;margin:0 0 16px}p{margin:8px 0;color:#62677e}small{color:#62677e}.primary{background:#585bd6;color:white;border-radius:14px;padding:14px 18px;font-weight:650}.wide{width:100%}.secondary{background:#e6e9ff;color:#4548b8;border-radius:12px;padding:12px}.icon{width:44px;height:44px;border-radius:14px;background:#e6e9ff;display:inline-grid;place-items:center;color:#585bd6;flex-shrink:0}.icon svg{width:24px;height:24px}.card{background:white;border:1px solid #e8e9f1;border-radius:17px;padding:14px;margin:10px 0}.listcard{width:100%;text-align:left;display:block}.grow{flex:1;min-width:0;overflow-wrap:anywhere}.progress{height:5px;background:#e6e9f3;border-radius:10px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:#585bd6;border-radius:10px}.footer{padding:12px 20px 22px;background:#f6f7fc;border-top:1px solid #e8e9f1}.home{width:100px;height:4px;background:#20243a;border-radius:9px;margin:0 auto 8px}input,textarea,select{width:100%;padding:13px;border:1px solid #dcdfea;background:white;border-radius:12px;color:#20243a}textarea{min-height:90px;resize:vertical}label{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}.rowitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eff0f5;min-height:49px}.rowitem:last-child{border:0}.check{border:2px solid #585bd6;border-radius:50%;width:24px;height:24px;flex-shrink:0;padding:0}.done{background:#585bd6;color:white}.muted{text-decoration:line-through;color:#74788d}.section{font-size:13px;font-weight:700;color:#62677e;margin-top:24px;letter-spacing:.5px}.danger{color:#c93649}.overlay{position:absolute;inset:0;background:#20243a66;display:flex;align-items:flex-end;z-index:3}.sheet{background:white;width:100%;padding:24px 20px 28px;border-radius:25px 25px 0 0;max-height:90%;overflow:auto}.menu{display:block;width:100%;text-align:left;padding:15px 8px;border-bottom:1px solid #eff0f5}.side{width:310px;padding:16px 0}.side h2{font-size:25px}.side button{display:block;background:white;border:1px solid #dcdfea;border-radius:10px;padding:10px 14px;margin:8px 0;width:100%;text-align:left}.swatch{display:inline-block;width:38px;height:38px;border-radius:10px;margin-right:5px}.toast{position:absolute;bottom:100px;left:20px;right:20px;background:#20243a;color:white;padding:12px;border-radius:12px;z-index:5}.auth{display:flex;flex-direction:column;justify-content:center;min-height:100%}.auth .logo{width:76px;height:76px;border-radius:24px;background:#e6e9ff;display:grid;place-items:center;margin-bottom:20px;color:#585bd6}.logo svg{width:42px;height:42px}.notice{background:#fff1d8;padding:10px;border-radius:10px;font-size:13px}.empty{text-align:center;padding:40px 8px}.spinner{width:30px;height:30px;border:3px solid #e6e9ff;border-top-color:#585bd6;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:760px){main{flex-direction:column;align-items:center;padding:8px;gap:12px}.phone{height: min(820px,95dvh);min-height:550px}.side{width:min(390px,100%)}}
.auth{justify-content:flex-start}.authart{text-align:center}.auth h1,.auth>p{text-align:center}.auth h1{margin:0}.tabs{display:flex;background:#e6e9ff;border-radius:14px;padding:4px;margin:18px 0 8px;gap:4px}.tabs button{flex:1;padding:10px;border-radius:10px;font-weight:650;color:#585bd6}.tabs .chosen{background:white;color:#4548b8;box-shadow:0 1px 4px #20243a18}.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.picker button{border:1px solid #e0e2ed;border-radius:12px;padding:8px;display:grid;justify-items:center;gap:4px;font-size:11px}.picker button svg{width:24px;height:24px}.picker .selected{border:2px solid #585bd6;background:#e6e9ff}.colors{display:flex;gap:8px;flex-wrap:wrap}.colors button{width:32px;height:32px;border-radius:50%;color:white}.avatar{border-radius:50%}</style><main><div class="phone" id="phone"></div><aside class="side"><small>DESIGN REVIEW · v0.2</small><h2>Soft Indigo</h2><p>Интерактивный прототип. Все данные локальные и демонстрационные.</p><div><span class="swatch" style="background:#585bd6"></span><span class="swatch" style="background:#e6e9ff"></span><span class="swatch" style="background:#f6f7fc"></span><span class="swatch" style="background:#20243a"></span></div><h3>Экраны и состояния</h3><button onclick="go('login')">Sign in</button><button onclick="go('register')">Register</button><button onclick="go('lists')">My Lists</button><button onclick="openList(1)">List Details</button><button onclick="go('lists');modal('new')">New List</button><button onclick="openList(1);modal('sharing')">Sharing</button><button onclick="state='loading';render()">Loading</button><button onclick="state='error';render()">Error / Retry</button><button onclick="state='empty';render()">Empty</button><button onclick="state='offline';render()">Offline</button><button onclick="state='normal';render()">Normal state</button><button onclick="reset()">Reset demo</button><p><small>Счётчики, прогресс, поиск и цветные иконки — новые предложения, не утверждённые функции. Авторизация и уведомления имитируются.</small></p></aside></main><script>
const paths={basket:'<path d="M3 10h18l-2 10H5L3 10Zm4 0 5-7 5 7M9 13v4m6-4v4"/>',home:'<path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/>',heart:'<path d="M12 21 4 13C-3 5 8 0 12 7c4-7 15-2 8 6z"/>',leaf:'<path d="M4 20C2 6 13 3 21 3c0 12-7 18-17 17Zm0 0L17 7"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/>'};Object.assign(paths,{gift:'<path d="M3 9h18v4H3zM5 13v8h14v-8M12 9v12M12 9C2 9 5 0 12 9c7-9 10 0 0 0"/>',coffee:'<path d="M4 8h13v7a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 9h2a3 3 0 0 1 0 6h-2M8 3v2m5-2v2"/>',travel:'<path d="m3 12 18-8-7 17-3-8z"/>',work:'<path d="M3 7h18v14H3zM8 7V3h8v4M3 12h18"/>'});const palette=['#585bd6','#3979c6','#21866b','#298ba8','#9061c6','#c65c91','#d18a25','#6b7280'];const tints=['#e6e9ff','#dceaff','#d9f2e8','#ddf1f8','#ede1fc','#f9e0ed','#fff0d5','#e9eaf0'];function pickIcon(k){document.querySelector('#listicon').value=k;document.querySelectorAll('[data-icon]').forEach(b=>b.classList.toggle('selected',b.dataset.icon===k));document.querySelector('#previewIcon').innerHTML=svg(k)}function pickColor(i){document.querySelector('#listcolor').value=i;document.querySelectorAll('[data-color]').forEach(b=>b.textContent=Number(b.dataset.color)===i?'✓':'');let p=document.querySelector('#previewIcon');p.style.background=tints[i];p.style.color=palette[i]}const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[k]||paths.list}</svg>`;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let lists,page='lists',id=1,state='normal',collapsed=false,search='',sheet='',editId=0,seq=100;function reset(){lists=[{id:1,name:'Groceries',desc:'Weekly shopping',icon:'basket',color:'#e6e9ff',items:['Milk','Bread','Eggs','Tomatoes','Avocado','Coffee','Bananas','Rice'].map((name,i)=>({id:i+1,name,done:i>4})),members:['dev1@gmail.com','yulia@gmail.com']},{id:2,name:'For home',desc:'Household essentials',icon:'home',color:'#dceaff',items:[{id:20,name:'Soap',done:false},{id:21,name:'Towels',done:true}],members:['dev1@gmail.com']},{id:3,name:'Market',desc:'',icon:'leaf',color:'#d9f2e8',items:[{id:30,name:'Apples',done:false}],members:['dev1@gmail.com']},{id:4,name:'Wishlist',desc:'',icon:'heart',color:'#f9e0ed',items:[],members:['dev1@gmail.com']}];go('lists')}function go(p){page=p;state='normal';sheet='';search='';render()}function openList(n){id=n;collapsed=false;go('detail')}function current(){return lists.find(l=>l.id===id)}function modal(s,n){sheet=s;editId=n??0;render()}function closeSheet(){sheet='';render()}function toast(t){let el=document.createElement('div');el.className='toast';el.textContent=t;document.querySelector('#phone').append(el);setTimeout(()=>el.remove(),2200)}function counts(l){let n=l.items.length,d=l.items.filter(x=>x.done).length;return [n,d,n?Math.round(d/n*100):0]}function progress(p){return `<div class="progress"><i style="width:${p}%"></i></div>`}function cards(){return lists.filter(l=>l.name.toLowerCase().includes(search.toLowerCase())).map(l=>{let[n,d,p]=counts(l);return `<button class="card listcard" onclick="openList(${l.id})"><div class="bar"><span class="icon" style="background:${l.color};color:${palette[Math.max(0,tints.indexOf(l.color))]}">${svg(l.icon)}</span><div class="grow"><b>${esc(l.name)}</b><br><small>${n} items · ${d} completed</small></div><small>${p}% ›</small></div>${progress(p)}</button>`}).join('')||'<div class="empty">No lists found</div>'}function items(done){return current().items.filter(x=>x.done===done).map(x=>`<div class="rowitem"><button aria-label="Toggle item" class="check ${done?'done':''}" onclick="toggle(${x.id})">${done?'✓':''}</button><span class="grow ${done?'muted':''}">${esc(x.name)}</span><button aria-label="Item actions" onclick="modal('itemmenu',${x.id})">•••</button></div>`).join('')||'<small>No items</small>'}function toggle(n){let x=current().items.find(x=>x.id===n);x.done=!x.done;render()}function addItem(){let v=document.querySelector('#quick').value.trim();if(v){current().items.push({id:seq++,name:v,done:false});render();document.querySelector('#quick')?.focus()}}function render(){let l=current(),body='',foot='';if(page==='login'||page==='register'){body=`<div class="auth"><div class="authart"><svg viewBox="0 0 300 180" width="100%" height="155" aria-label="Grocery bag with bread, milk and vegetables"><ellipse cx="150" cy="166" rx="91" ry="8" fill="#e6e9ff"/><path d="M104 92V68Q104 32 139 32Q174 32 174 68V92" fill="none" stroke="#a5a8e8" stroke-width="9"/><g transform="rotate(-22 100 80)"><rect x="83" y="9" width="34" height="112" rx="17" fill="#f2ca83"/><path d="m87 35 24 9m-24 12 24 9m-24 12 24 9" stroke="#fff1cb" stroke-width="5" stroke-linecap="round"/></g><path d="M137 39h39l12 20v70h-51z" fill="#fff" stroke="#b8c2e8" stroke-width="2"/><path d="M137 39h39l12 20h-51z" fill="#a8b7f1"/><rect x="137" y="75" width="51" height="34" fill="#dceaff"/><text x="162" y="96" text-anchor="middle" font-size="12" fill="#585bd6" font-weight="bold">MILK</text><path d="M197 94Q169 40 195 33Q216 35 211 75Q226 29 243 44Q257 65 220 103" fill="#76b99d"/><path d="M205 105Q186 72 169 80Q152 96 187 121" fill="#a9d5b4"/><circle cx="211" cy="102" r="19" fill="#f19a9c"/><path d="m205 83 6 7 8-6" fill="none" stroke="#388b70" stroke-width="4"/><path d="M66 87H234L216 158Q214 166 204 166H96Q86 166 84 158Z" fill="#c5c8f6" stroke="#a5a8e8" stroke-width="2"/><path d="M119 101v15q0 29 31 29t31-29v-15" fill="none" stroke="#8589d9" stroke-width="5" stroke-linecap="round"/><path d="m139 128 9 9 17-19" fill="none" stroke="#585bd6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h1>Shopping List</h1><p>Plan, shop and share together.</p><div class="tabs"><button class="${page==='login'?'chosen':''}" onclick="go('login')">Sign in</button><button class="${page==='register'?'chosen':''}" onclick="go('register')">Register</button></div><h2 style="margin-top:12px">${page==='login'?'Welcome back':'Create account'}</h2><form onsubmit="event.preventDefault();go('lists');toast('Demo signed in')"><label>Email</label><input type="email" required placeholder="you@example.com"><label>Password</label><input type="password" required placeholder="Your password"><button class="primary wide" style="margin-top:20px">${page==='login'?'Sign in':'Register'}</button></form></div>`;foot='<small>SL-Dev · v1.0.0</small>'}else if(page==='lists'){body=`<div class="bar"><h1>My Lists</h1><button class="icon avatar" aria-label="Account" onclick="modal('account')">D</button></div><p>Keep everything in one place.</p><input aria-label="Search lists" placeholder="⌕  Search lists" value="${esc(search)}" oninput="search=this.value;document.querySelector('#cards').innerHTML=cards()" style="margin:16px 0 4px"><div id="cards">${cards()}</div>`;foot='<button class="primary wide" onclick="modal(\'new\')">＋ New list</button>'}else if(l){let[n,d,p]=counts(l);body=`<div class="bar"><button aria-label="Back" onclick="go('lists')">←</button><div><button aria-label="Sharing" onclick="modal('sharing')">♧</button><button aria-label="List actions" onclick="modal('actions')">•••</button></div></div><div class="bar" style="justify-content:flex-start;margin-top:20px"><span class="icon" style="background:${l.color};color:${palette[Math.max(0,tints.indexOf(l.color))]}">${svg(l.icon)}</span><h1>${esc(l.name)}</h1></div><p>${esc(l.desc)}</p><small>Updated just now · demo</small><div class="card" style="background:#e6e9ff"><div class="bar"><b>${d} of ${n} purchased</b><b>${p}%</b></div>${progress(p)}</div><div class="section">TO BUY · ${n-d}</div><div class="card">${items(false)}</div><button class="bar section wide" onclick="collapsed=!collapsed;render()">COMPLETED · ${d}<span>${collapsed?'⌄':'⌃'}</span></button>${collapsed?'':`<div class="card">${items(true)}</div>`}`;foot='<form class="bar" onsubmit="event.preventDefault();addItem()"><input id="quick" placeholder="Add an item…" aria-label="New item"><button class="primary" aria-label="Add item">＋</button></form>'}if(state==='loading')body='<div class="empty"><div class="spinner"></div>Loading…</div>';if(state==='error')body='<div class="empty"><h2>Something went wrong</h2><p>Could not load your data.</p><button class="primary" onclick="state=\'normal\';render()">Retry</button></div>';if(state==='empty')body=`<h1>${page==='detail'?'Groceries':'My Lists'}</h1><div class="empty"><span class="icon">${svg('basket')}</span><h2 style="margin-top:20px">${page==='detail'?'No items yet':'No lists yet'}</h2><p>${page==='detail'?'Add your first item below.':'Create your first shopping list.'}</p></div>`;if(state==='offline')body='<div class="notice">You are offline · showing demo cached data</div>'+body;document.querySelector('#phone').innerHTML=`<div class="status"><span>9:41</span><span>▴ ▰ ▰</span></div><div class="screen">${body}</div><div class="footer">${foot}</div><div class="home"></div>${sheet?sheetHTML():''}`}
function sheetHTML(){let l=current(),x=l?.items.find(x=>x.id===editId),s='',title='';const btn=(t,code,cls='menu')=>`<button class="${cls}" onclick="${code}">${t}</button>`;if(sheet==='new'||sheet==='editlist'){let edit=sheet==='editlist';title=edit?'Edit list':'New list';s=`<form onsubmit="event.preventDefault();saveList(${edit})"><label>List name</label><input id="name" required value="${edit?esc(l.name):''}"><label>Description</label><textarea id="desc">${edit?esc(l.desc):''}</textarea><label>List appearance · proposed</label><div style="display:flex;justify-content:center;margin:10px"><span id="previewIcon" class="icon" style="background:${edit?l.color:tints[0]};color:${palette[Math.max(0,tints.indexOf(edit?l.color:tints[0]))]}">${svg(edit?l.icon:'basket')}</span></div><input type="hidden" id="listicon" value="${edit?l.icon:'basket'}"><input type="hidden" id="listcolor" value="${Math.max(0,tints.indexOf(edit?l.color:tints[0]))}"><div class="picker">${Object.keys(paths).map(k=>`<button type="button" data-icon="${k}" class="${(edit?l.icon:'basket')===k?'selected':''}" onclick="pickIcon('${k}')">${svg(k)}${k}</button>`).join('')}</div><label>Color</label><div class="colors">${palette.map((c,i)=>`<button type="button" aria-label="Color ${i+1}" data-color="${i}" style="background:${c}" onclick="pickColor(${i})">${i===Math.max(0,tints.indexOf(edit?l.color:tints[0]))?'✓':''}</button>`).join('')}</div><button class="primary wide" style="margin-top:20px">${edit?'Save':'Create list'}</button></form>`}if(sheet==='account'){title='Account';s='<p>dev1@gmail.com</p><small>SL-Dev · v1.0.0</small>'+btn('Log out',"go('login')",'menu danger')}if(sheet==='actions'){title='List actions';s=btn('✎  Edit list',"modal('editlist')")+btn('♧  Sharing',"modal('sharing')")+btn('♢  Notify members',"closeSheet();toast('Demo notification sent')")+btn('Delete list',"modal('deletelist')",'menu danger')}if(sheet==='sharing'){title='Sharing';s='<small>MEMBERS</small>'+l.members.map((m,i)=>`<div class="rowitem"><span class="icon">${esc(m[0].toUpperCase())}</span><div class="grow">${esc(m)}<br><small>${i?'Member':'Owner'}</small></div>${i?btn('×',`current().members.splice(${i},1);render()`,'danger'):''}</div>`).join('')+`<form onsubmit="event.preventDefault();addMember()"><label>Add member</label><div class="bar"><input id="email" type="email" required placeholder="Email address"><button class="primary">＋</button></div></form>`}if(sheet==='itemmenu'){title=esc(x.name);s=btn('Edit item',`modal('edititem',${x.id})`)+btn('Delete item',`modal('deleteitem',${x.id})`,'menu danger')}if(sheet==='edititem'){title='Edit item';s=`<form onsubmit="event.preventDefault();saveItem()"><label>Item name</label><input id="itemname" required value="${esc(x.name)}"><button class="primary wide" style="margin-top:20px">Save</button></form>`}if(sheet==='deleteitem'||sheet==='deletelist'){title=sheet==='deleteitem'?'Delete item?':'Delete list?';s='<p>This action cannot be undone.</p>'+btn('Delete',sheet==='deleteitem'?'deleteItem()':'deleteList()','primary wide') }return `<div class="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog"><div class="bar"><h2>${title}</h2><button aria-label="Close" onclick="closeSheet()">✕</button></div>${s}<button class="wide secondary" style="margin-top:12px" onclick="closeSheet()">${sheet==='sharing'?'Done':'Cancel'}</button></div></div>`}function saveList(edit){let name=document.querySelector('#name').value.trim(),desc=document.querySelector('#desc').value.trim(),icon=document.querySelector('#listicon').value,color=tints[Number(document.querySelector('#listcolor').value)];if(!name)return;if(edit)Object.assign(current(),{name,desc,icon,color});else lists.push({id:seq++,name,desc,icon,color,items:[],members:['dev1@gmail.com']});closeSheet()}function saveItem(){let v=document.querySelector('#itemname').value.trim();if(v){current().items.find(x=>x.id===editId).name=v;closeSheet()}}function deleteItem(){current().items=current().items.filter(x=>x.id!==editId);closeSheet()}function deleteList(){lists=lists.filter(l=>l.id!==id);go('lists')}function addMember(){let v=document.querySelector('#email').value.trim();if(v&&!current().members.includes(v)){current().members.push(v);render()}}reset();</script></html>
